services:
  nginx:
    image: nginx:alpine
    container_name: weiwuweixin-nginx
    restart: unless-stopped
    ports:
      - "5006:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: weiwuweixin-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgresql://zhuwankai:zhuwankai@43.143.217.180:5432/zhuwankai
      JWT_SECRET: ${JWT_SECRET:-dev-secret-123}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-/app/logs/api.log}
    volumes:
      - api-logs:/app/logs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: weiwuweixin-web
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - api

volumes:
  api-logs:
